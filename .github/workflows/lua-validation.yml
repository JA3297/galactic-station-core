name: Lua 5.2 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-crypto:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Compile-check every Lua file
        run: |
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.2 -p "$file"
          done

      - name: Run SHA-256 and HMAC self-tests
        run: |
          LUA_PATH='./?.lua;;' lua5.2 admin_crypto_test.lua
